<!DOCTYPE html>
<html>

<title>Divider Ornament Preview</title>

    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 60px;
  }
  .label {
    font-family: sans-serif;
    font-size: 12px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: -40px;
  }
